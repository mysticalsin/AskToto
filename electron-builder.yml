appId: com.asktoto.app
productName: AskToto
directories:
  buildResources: build
  output: release
files:
  - dist
  - dist-electron
  - node_modules
  - "!cluely-extracted"
  - "!cluely-setup.exe"
  - "!python"
  - "!.claude"
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
